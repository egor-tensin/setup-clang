name: Build threads.exe
description: Build threads.exe
inputs:
  binary:
    description: Compiler binary file name
    required: false
    default: clang++
  platform:
    description: Target platform
    required: true
runs:
  using: composite
  steps:
    - run: |
        $version = '${{ inputs.version }}'
        $version = if ($version) { "-$version" } else { $version }

        $flags = @()
        if ('${{ matrix.platform }}' -eq 'x86') {
            $flags += '-m32'
        }
        $flags += '-std=c++14','-o','test/threads.exe','test/threads.cpp'
        if ('${{ runner.os }}' -eq 'Linux') {
            $flags += '-lpthread'
        }

        & '${{ inputs.binary }}' $flags
      shell: pwsh
